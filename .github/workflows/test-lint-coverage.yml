name: Test, Lint & Coverage

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pylint coverage

      - name: Build and install self
        run: |
          python dist.py
          python local_install.py

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          pylint HDpip --rcfile=.pylintrc --output-format=text > pylint.txt 2>&1 || true
          SCORE=$(grep -oP 'rated at \K[0-9.]+' pylint.txt | tail -1)
          if [ -z "$SCORE" ]; then SCORE="N/A"; fi
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "--- pylint 输出 ---"
          cat pylint.txt

      - name: Test & Coverage
        id: test
        continue-on-error: true
        run: |
          coverage run -m pytest tests/ -q --tb=short > pytest.txt 2>&1
          TEST_EXIT=$?
          coverage report > coverage.txt 2>&1 || true
          SUMMARY=$(tail -1 pytest.txt)
          TOTAL=$(coverage report --format=total 2>/dev/null || grep TOTAL coverage.txt | awk '{print $NF}')
          if [ -z "$TOTAL" ]; then TOTAL="N/A"; fi
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "--- pytest 输出 ---"
          cat pytest.txt
          echo "--- coverage 输出 ---"
          cat coverage.txt
          if [ "$TEST_EXIT" != "0" ]; then
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: steps.test.outcome == 'success'
        run: python coverage_upload.py ${{ secrets.CODECOV_TOKEN }}

      - name: Check results
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "lint 失败"
            FAILED=1
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "test/coverage 失败"
            FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Test / Lint / Coverage"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅ 通过' || '❌ 失败' }} |"
            echo "| Lint 分数 | ${{ steps.lint.outputs.score }} |"
            echo "| Test | ${{ steps.test.outcome == 'success' && '✅ 通过' || '❌ 失败' }} |"
            echo "| Test 摘要 | ${{ steps.test.outputs.summary }} |"
            echo "| 覆盖率 | ${{ steps.test.outputs.total }} |"
            echo ""
            echo "[Workflow 运行](${RUN_URL})"
            echo ""
            if [ -f pytest.txt ]; then
              echo "### pytest 最后 30 行"
              echo '```'
              tail -30 pytest.txt
              echo '```'
            fi
            if [ -f pylint.txt ]; then
              echo "### pylint 最后 20 行"
              echo '```'
              tail -20 pylint.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
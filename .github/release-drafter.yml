# .github/release-drafter.yml

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🟢 Added / 新增'
    commits:
      - 'feat:'
  - title: '🔵 Optimized / 优化'
    commits:
      - 'chore:'
  - title: '🟣 Fixed / 修复'
    commits:
      - 'fix:'
  - title: '🟤 Refactored / 重构'
    commits:
      - 'refactor:'
  - title: '🟡 Changed / 变更'
    commits:
      - 'docs:'
      - 'rename:'
  - title: '🔴 Removed / 移除'
    commits:
      - 'del:'
  # Deprecated 暂无对应 commit，保留用于未来扩展
  - title: '🟠 Deprecated / 弃用'
    commits: []  # 留空，后续如有需要可添加对应前缀

version-resolver:
  major:
    commits:
      - 'feat!:'
      - 'fix!:'
      - 'refactor!:'
  minor:
    commits:
      - 'feat:'
      - 'refactor:'
  patch:
    commits:
      - 'fix:'
      - 'chore:'
      - 'docs:'
      - 'del:'
      - 'rename:'
  default: patch

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## 📦 更新内容

  $CHANGES

  ## 👥 贡献者

  感谢 $CONTRIBUTORS 的贡献！
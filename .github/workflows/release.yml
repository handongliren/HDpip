name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Immutable Releases 需要：contents: write 上传附件
# 构建来源证明需要：id-token: write + attestations: write
# PyPI trusted publishing 需要：id-token: write
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_VERSION=$(python -c "import HDpip; print(HDpip.version)")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) 与包版本 ($PKG_VERSION) 不一致"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in dist/*.whl dist/*.tar.gz; do
            echo "Verifying $f"
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

      - name: Extract changelog for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          : > release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^##[[:space:]]/ {
                if (flag) { exit }
                if (index($0, ver) > 0) { flag=1; next }
              }
              flag { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.version.outputs.tag }}" > release_notes.md
          fi
          cat release_notes.md

      # 计算 SHA256 并以表格形式写入 Release Notes 和 Job Summary，
      # 文件名只保留 basename，不带路径。
      - name: Generate SHA256 checksums
        run: |
          shopt -s nullglob
          {
            echo ""
            echo "## SHA256 Checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
          } > sha256_table.md
          for f in dist/*.whl dist/*.tar.gz; do
            sum=$(sha256sum "$f" | awk '{print $1}')
            name=$(basename "$f")
            echo "| \`$name\` | \`$sum\` |" >> sha256_table.md
          done
          cat sha256_table.md >> release_notes.md
          cat sha256_table.md >> "$GITHUB_STEP_SUMMARY"

      # 关键：Immutable Release 一旦发布就无法再上传附件，
      # 所以必须先创建草稿、上传完所有附件、最后再发布。
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG 已发布且可能已启用 Immutable Releases，无法再上传附件。请删除该 Release 或改用新的 tag。"
              exit 1
            fi
            echo "复用已存在的草稿 Release: $TAG"
            gh release edit "$TAG" --notes-file release_notes.md --repo "$REPO"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file release_notes.md \
              --repo "$REPO"
            echo "已创建草稿 Release: $TAG"
          fi

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --clobber \
            --repo "${{ github.repository }}"

      # 先准备好草稿 Release 和附件，再发布到 PyPI。
      # Trusted publishing 使用 OIDC，无需在仓库中保存 API Token。
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --repo "${{ github.repository }}"
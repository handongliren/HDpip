name: Sync Changelog to Release

# release 发布后（正式版或预览版，published 均触发）自动从 CHANGELOG.md
# 提取对应版本的条目并写入 release body。draft 阶段不触发（GitHub 平台限制），
# 需要手动同步时可用 workflow_dispatch 触发。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（如 0.0.5，不带 v 前缀）'
        required: true
        default: ''
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.tag }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "使用的版本号: $VERSION"

      - name: Extract changelog for this version
        id: extract
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "未找到版本号" > changelog_entry.md
            exit 0
          fi
          
          awk -v ver="$VERSION" '
            BEGIN { found=0; output="" }
            /^## 🔖 `[0-9]+\.[0-9]+\.[0-9]+`/ {
              line = $0
              gsub(/^## 🔖 `/, "", line)
              gsub(/`.*$/, "", line)
              if (line == ver) { found=1; next }
              if (found) { exit }
            }
            found { output = output $0 "\n" }
            END {
              if (found) {
                gsub(/^[ \t\n]+/, "", output)
                gsub(/[ \t\n]+$/, "", output)
                print output
              } else {
                print "未找到版本 " ver
              }
            }
          ' CHANGELOG.md > changelog_entry.md
          
          # 使用多行输出语法
          {
            echo 'content<<EOF'
            cat changelog_entry.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
          echo "提取的内容："
          cat changelog_entry.md

      - name: Update Release Body
        uses: actions/github-script@v7
        env:
          CONTENT: ${{ steps.extract.outputs.content }}
        with:
          script: |
            const content = process.env.CONTENT;
            
            if (!content || !content.trim() || content.trim().startsWith('未找到版本')) {
              console.log('未找到对应版本的 CHANGELOG 条目，跳过更新。');
              return;
            }
            
            // 如果是 release 事件，更新对应的 release
            if (context.eventName === 'release') {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: content
              });
              console.log('✅ Release Body 已更新');
            } else {
              // 手动触发时，输出到日志和摘要
              console.log('📝 手动触发模式，提取的内容如下：');
              console.log(content);
            }

      - name: Summary output (manual mode)
        run: |
          echo "## 📋 提取的 CHANGELOG 内容" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          cat changelog_entry.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY